# ============================================================
# NOVIQ — Production Docker Compose Orchestration
# Services: backend (Express 5 + SQLite), frontend (Next.js 15), nginx
# ============================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: noviq-backend
    restart: unless-stopped
    ports:
      - "4322:4322"
    environment:
      - NODE_ENV=production
      - PORT=4322
      - DB_PATH=/app/data/noviq.db
      - UPLOADS_DIR=/app/uploads
      - JWT_SECRET=${JWT_SECRET:-noviq_jwt_production_secret_key_change_me_2026}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-noviq2026}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:4321,http://localhost}
      - FRONTEND_REVALIDATE_URL=http://frontend:4321
      - REVALIDATE_SECRET=${REVALIDATE_SECRET:-noviq_revalidate_shared_secret_key_2026}
    volumes:
      - noviq_db_data:/app/data
      - noviq_uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:4322/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - noviq-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4322}
    container_name: noviq-frontend
    restart: unless-stopped
    ports:
      - "4321:4321"
    environment:
      - NODE_ENV=production
      - PORT=4321
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4322}
      - API_INTERNAL_URL=http://backend:4322
      - REVALIDATE_SECRET=${REVALIDATE_SECRET:-noviq_revalidate_shared_secret_key_2026}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - noviq-net

  nginx:
    image: nginx:alpine
    container_name: noviq-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - noviq-net

volumes:
  noviq_db_data:
    name: noviq_db_data
  noviq_uploads_data:
    name: noviq_uploads_data

networks:
  noviq-net:
    driver: bridge
